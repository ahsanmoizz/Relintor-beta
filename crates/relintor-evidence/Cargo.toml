[package]
name = "relintor-evidence"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[features]
default = []
test-support = []

[dependencies]
base64 = "0.22"
hmac = "0.12"
getrandom = "0.2"
relintor-ai-gateway = { path = "../../services/ai-gateway" }
relintor-execution = { path = "../relintor-execution" }
relintor-standards = { path = "../relintor-standards" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
walkdir = "2"

[dev-dependencies]
ed25519-dalek = "2"
tempfile = "3"
relintor-evidence = { path = ".", features = ["test-support"] }
