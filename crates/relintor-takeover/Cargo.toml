[package]
name = "relintor-takeover"
version = "0.1.0"
description = "Deterministic, read-only existing-project takeover discovery"
edition.workspace = true
rust-version.workspace = true

[dependencies]
relintor-investigator = { path = "../relintor-investigator" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
