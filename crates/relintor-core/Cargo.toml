[package]
name = "relintor-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
getrandom = "0.2"
keyring = { version = "3.6", default-features = false, features = ["windows-native"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
